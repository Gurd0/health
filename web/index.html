<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Health &amp; Running</title>
<script>
  // Apply the saved theme before first paint (see useTheme in src/hooks.ts).
  try { var th = localStorage.getItem("hr-theme"); if (th === "light" || th === "dark") document.documentElement.dataset.theme = th; } catch (e) {}
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
